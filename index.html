<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="JAMS Fitness — simple workout plans for Beginner, Intermediate and Expert. Find your level, follow the plan, track your progress.">
<title>JAMS Fitness — Workouts for every level</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e5e9f2;
  --brand:#2563eb; --brand-soft:#e8efff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --lvl:#2563eb; --lvl-soft:#e8efff;
  --radius:20px; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1020;--card:#151b2e;--text:#eef2ff;--muted:#94a3b8;--line:#263049;--brand-soft:#1c2a4d;--shadow:none}
}
body[data-level="beginner"]{--lvl:#16a34a;--lvl-soft:#e6f6ec}
body[data-level="intermediate"]{--lvl:#ea580c;--lvl-soft:#fdeee4}
body[data-level="expert"]{--lvl:#7c3aed;--lvl-soft:#f0e9fe}
@media (prefers-color-scheme:dark){
  body[data-level="beginner"]{--lvl-soft:#12301f}
  body[data-level="intermediate"]{--lvl-soft:#3a2214}
  body[data-level="expert"]{--lvl-soft:#2a1f47}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(110px + var(--safe-b))}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--lvl-soft);color:var(--lvl);font-weight:700;font-size:14px;border:0}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--muted);margin:2px 4px 2px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border-radius:16px;border:0;background:var(--lvl);color:#fff;font-weight:800;font-size:18px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--lvl-soft);color:var(--lvl)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.danger{background:#fde8e8;color:var(--bad)}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;width:auto;padding:8px 14px}
.link{background:none;border:0;color:var(--lvl);font-weight:700;padding:6px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:.02em}
.logo svg{width:34px;height:34px}
/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}
.tabbar .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:700}
.tab .ic{font-size:23px;line-height:1;filter:grayscale(1);opacity:.65}
.tab.on{color:var(--lvl)}
.tab.on .ic{filter:none;opacity:1}
/* Hero */
.hero{background:linear-gradient(135deg,var(--lvl),color-mix(in srgb,var(--lvl) 60%,#000));color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .btn{background:#fff;color:var(--lvl)}
.big-emoji{font-size:44px;line-height:1}
/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0 7px;text-align:center;font-size:12px;color:var(--muted)}
.day b{display:block;font-size:13px;color:var(--text)}
.day .e{font-size:18px;display:block;margin-top:2px}
.day.today{border:2px solid var(--lvl);background:var(--lvl-soft)}
.day.done .e::after{content:"✓";color:var(--ok);font-weight:900;font-size:13px;margin-left:1px}
/* Exercise card */
.ex{padding:16px}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-emoji{width:52px;height:52px;flex:0 0 52px;border-radius:16px;background:var(--lvl-soft);display:grid;place-items:center;font-size:28px}
.ex-title{font-weight:800;font-size:18px}
.target{font-weight:700;color:var(--lvl);font-size:15px}
details.how{margin-top:12px;border-radius:14px;background:var(--bg);padding:2px 14px}
details.how summary{list-style:none;padding:10px 0;font-weight:700;color:var(--lvl);cursor:pointer}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"▸ ";}
details.how[open] summary::before{content:"▾ ";}
details.how ol{margin:0 0 10px;padding-left:22px}
details.how li{margin:6px 0}
.tip{margin:6px 0 12px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px dashed var(--line);font-size:15px}
.hint{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff7e0;color:#7a4b00;font-size:15px;font-weight:600}
@media (prefers-color-scheme:dark){.hint{background:#3a2e10;color:#ffd98a}}
.sets{margin-top:12px}
.set{display:grid;grid-template-columns:54px 1fr 1fr 56px;gap:8px;align-items:center;margin-top:8px}
.set.nowt{grid-template-columns:54px 1fr 56px}
.set label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px}
.set .n{font-weight:800;color:var(--muted);font-size:15px}
.num{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-size:20px;font-weight:800;padding:0 4px}
.num::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.num:focus{outline:none;border-color:var(--lvl)}
.check{height:50px;width:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:24px;color:var(--muted);align-self:end}
.set.isdone .check{background:var(--ok);border-color:var(--ok);color:#fff}
.set.isdone .num{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--lvl);border-radius:99px;transition:width .3s}
/* Level cards */
.lvl{border:2px solid var(--line);text-align:left;width:100%;background:var(--card);border-radius:var(--radius);padding:16px;display:block}
.lvl.sel{border-color:var(--c)}
.lvl .t{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;color:var(--c)}
.lvl ul{margin:8px 0 0;padding-left:20px;color:var(--text);font-size:15px}
.lvl li{margin:3px 0}
/* Quiz */
.opt{display:flex;gap:14px;align-items:center;width:100%;min-height:64px;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:600}
.opt .e{font-size:28px}
.opt:active,.opt.sel{border-color:var(--lvl);background:var(--lvl-soft)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--lvl);width:22px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:900;color:var(--lvl)}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 2px;border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--lvl);box-shadow:var(--shadow)}
select.sel{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;font-weight:600}
input.txt{width:100%;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:19px}
input.txt:focus{outline:none;border-color:var(--lvl)}
.hist{border-left:4px solid var(--lvl);padding:10px 12px;background:var(--card);border-radius:0 14px 14px 0;margin-top:8px}
.badge{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px;margin:4px 4px 0 0}
.xbtn{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 8px;border-radius:8px}
.xbtn:hover{color:var(--bad)}
/* Timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));max-width:536px;margin:0 auto;background:#0f172a;color:#fff;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.3);transform:translateY(calc(100% + 140px));visibility:hidden;transition:transform .25s,visibility .25s}
.timer.show{transform:none;visibility:visible}
.timer .t{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;min-width:74px}
.timer button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.sheet{background:var(--card);border-radius:24px;padding:22px;max-width:520px;width:100%;margin-bottom:var(--safe-b)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.celebrate{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.chart{width:100%;height:auto;display:block}
.empty{text-align:center;padding:28px 12px}
.empty .big-emoji{margin-bottom:8px}
.center{text-align:center}
.hide{display:none!important}
</style>
</head>
<body data-level="beginner">
<div class="wrap" id="view"></div>

<nav class="tabbar" id="tabbar">
  <div class="in">
    <button class="tab" data-go="today"><span class="ic">🏠</span>Today</button>
    <button class="tab" data-go="library"><span class="ic">📚</span>Exercises</button>
    <button class="tab" data-go="progress"><span class="ic">📈</span>Progress</button>
    <button class="tab" data-go="me"><span class="ic">🙂</span>Me</button>
  </div>
</nav>

<div class="timer" id="timer" role="status" aria-live="polite">
  <div><div class="small" style="opacity:.75;font-weight:700">Rest time 😮‍💨</div><div class="t" id="timer-t">1:00</div></div>
  <div style="flex:1"></div>
  <button id="timer-add">+15s</button>
  <button id="timer-skip">Skip ⏭</button>
</div>
<div class="toast" id="toast"></div>
<div id="layer"></div>

<script>
/* =========================================================
   JAMS Fitness — single-file app. No build step, no server.
   Data is stored on this device (localStorage).
   ========================================================= */

/* ---------- Levels ---------- */
const LEVELS = {
  beginner: {
    name:'Beginner', emoji:'🌱', color:'#16a34a', rest:60,
    tagline:'No equipment. Learn the moves.',
    equipment:'Just you, a wall, a sturdy chair and a backpack',
    who:['You are new to exercise, or coming back after a long break','You can do fewer than 6 push-ups','You want to work out at home','You are under 13 (always start here!)'],
  },
  intermediate: {
    name:'Intermediate', emoji:'🔥', color:'#ea580c', rest:90,
    tagline:'Dumbbells & machines. Build real strength.',
    equipment:'Dumbbells, cable machines, a bench',
    who:['You have exercised regularly for at least 2–3 months','You can do 6–20 push-ups with good form','You know how to use basic gym machines','You finished the Beginner plan and it feels easy'],
  },
  expert: {
    name:'Expert', emoji:'🏆', color:'#7c3aed', rest:120,
    tagline:'Barbells. Heavy lifts. Big goals.',
    equipment:'Barbell, squat rack, pull-up bar, full gym',
    who:['You have trained 3+ times a week for 6+ months','You can do 20+ push-ups and some pull-ups','You know how to squat, bench and deadlift safely','Adults only — or teens with a coach watching'],
  },
};

/* ---------- Exercise library ---------- */
const YT = id => 'https://www.youtube.com/watch?v=' + id;
const YTS = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent('how to do ' + q + ' proper form');

const EX = {
  // ---- Beginner (bodyweight) ----
  knee_pushup:{name:'Knee Push-Ups',e:'🙌',m:['Chest','Arms'],steps:['Kneel on the floor and put your hands a little wider than your shoulders.','Keep your body straight from head to knees, like a plank.','Lower your chest towards the floor, then push back up.'],tip:'Too hard? Do them standing, pushing against a wall.'},
  backpack_row:{name:'Backpack Rows',e:'🎒',m:['Back','Arms'],weight:true,steps:['Put a few books in a backpack. Hold it with both hands.','Bend forward at your hips with a flat back and soft knees.','Pull the bag up to your belly button, squeeze your back, then lower it slowly.'],tip:'Keep your back flat like a table — no rounding.'},
  shoulder_tap:{name:'Plank Shoulder Taps',e:'👋',m:['Shoulders','Core'],per:'each side',steps:['Get into a push-up position with straight arms.','Lift one hand and tap the opposite shoulder.','Put it back and switch. Try not to rock your hips.'],tip:'Spread your feet wider to make it easier.'},
  plank:{name:'Plank',e:'🧱',m:['Core'],time:true,steps:['Rest on your forearms and toes.','Make a straight line from head to heels.','Squeeze your tummy and breathe. Hold!'],tip:'Hips sagging? Drop to your knees and keep going.',video:YT('pSHjTRCQxIw')},
  squat:{name:'Bodyweight Squats',e:'🪑',m:['Legs','Glutes'],steps:['Stand with feet shoulder-width apart.','Sit back like you are sitting on a chair. Keep your chest up.','Go down until thighs are about level with the floor, then stand up.'],tip:'Use a real chair behind you until you feel confident.'},
  glute_bridge:{name:'Glute Bridges',e:'🌉',m:['Glutes','Hamstrings'],steps:['Lie on your back, knees bent, feet flat on the floor.','Push through your heels and lift your hips up high.','Squeeze your bottom at the top, then lower slowly.'],tip:'Hold the top for 2 seconds to make it harder.'},
  calf_raise_bw:{name:'Calf Raises',e:'🦶',m:['Calves'],steps:['Stand tall and hold a wall for balance.','Rise up onto your tiptoes as high as you can.','Lower your heels slowly back down.'],tip:'Stand on a step and let your heels drop below it to work harder.',video:YT('-M4-G8p8fmc')},
  dead_bug:{name:'Dead Bug',e:'🐞',m:['Core'],per:'each side',steps:['Lie on your back with arms pointing to the ceiling and knees bent up.','Slowly stretch one arm back and the opposite leg out.','Bring them back and switch sides. Keep your lower back on the floor.'],tip:'Slow is better. Breathe out as you stretch.'},
  incline_pushup:{name:'Incline Push-Ups',e:'📐',m:['Chest','Arms'],steps:['Put your hands on a bench, sturdy table or stairs.','Walk your feet back until your body is straight.','Lower your chest to the edge, then push away.'],tip:'The lower the surface, the harder it is.'},
  backpack_curl:{name:'Backpack Curls',e:'💪',m:['Biceps'],weight:true,steps:['Hold a backpack by the handle (or two water bottles).','Keep elbows tucked at your sides.','Curl it up to your shoulders, then lower slowly.'],tip:'No swinging! Keep your body still.'},
  chair_dip:{name:'Chair Dips',e:'🪑',m:['Triceps'],steps:['Sit on the edge of a sturdy chair that will not slide. Hands next to your hips.','Slide your bottom off the chair, knees bent.','Bend your elbows to lower a little, then push back up.'],tip:'Only go down a little at first. Keep shoulders away from your ears.'},
  bird_dog:{name:'Bird Dog',e:'🐕',m:['Core','Back'],per:'each side',steps:['Start on hands and knees.','Reach one arm forward and the opposite leg back.','Hold for 2 seconds, come back, switch.'],tip:'Pretend there is a cup of water on your back — do not spill it!'},
  reverse_lunge:{name:'Reverse Lunges',e:'🦵',m:['Legs','Glutes'],per:'each leg',steps:['Stand tall with feet together.','Step one foot back and bend both knees.','Push through your front foot to stand back up. Switch legs.'],tip:'Hold a wall or chair for balance.'},
  wall_sit:{name:'Wall Sit',e:'🧍',m:['Legs'],time:true,steps:['Lean your back flat against a wall.','Slide down until your knees are bent like a chair.','Hold it there. Keep breathing!'],tip:'Not as low? That is fine — go only as low as feels OK.'},
  step_up:{name:'Step-Ups',e:'🪜',m:['Legs','Glutes'],per:'each leg',steps:['Stand in front of a low, sturdy step or the bottom stair.','Step up with one foot and stand tall on top.','Step down slowly. Do all reps, then switch legs.'],tip:'Push through the heel of the foot that is on the step.',video:YT('D7KaRcUTQeE')},
  side_plank:{name:'Side Plank',e:'📏',m:['Core'],time:true,per:'each side',steps:['Lie on your side, propped up on your forearm.','Lift your hips so your body is straight.','Hold, then switch sides.'],tip:'Bend your bottom knee on the floor to make it easier.'},

  // ---- Intermediate (dumbbells & machines) ----
  pushup:{name:'Push-Ups',e:'🙌',m:['Chest','Arms','Core'],steps:['Hands a little wider than your shoulders, body straight.','Lower your chest until it nearly touches the floor.','Push back up. Elbows point slightly back, not straight out.'],tip:'Can do 20 easily? Put your feet on a bench.'},
  lat_pulldown:{name:'Lat Pulldowns',e:'⬇️',m:['Back','Biceps'],weight:true,start:'60 lbs',steps:['Sit at the machine with thighs under the pad. Grab the bar wide.','Lean back a little and pull the bar to your upper chest.','Squeeze your shoulder blades, then let the bar rise slowly.'],tip:'Pull with your elbows, not your hands.',video:YT('CAwf7n6Luuc')},
  db_press:{name:'Dumbbell Shoulder Press',e:'🏋️',m:['Shoulders','Triceps'],weight:true,start:'15 lbs each',steps:['Sit tall on a bench with back support. Dumbbells at shoulder height.','Press them up until arms are straight.','Lower slowly back to your shoulders.'],tip:'Do not arch your lower back — squeeze your tummy.',video:YT('qEwKCR5JCog')},
  db_curl:{name:'Bicep Curls',e:'💪',m:['Biceps'],weight:true,start:'15 lbs each',steps:['Stand tall holding dumbbells, palms facing forward.','Curl the weights up, keeping elbows by your sides.','Lower slowly — count to 3 on the way down.'],tip:'If you have to swing, the weight is too heavy.',video:YT('ykJmrZ5v0Oo')},
  goblet_squat:{name:'Goblet Squats',e:'🏆',m:['Legs','Glutes','Core'],weight:true,start:'20 lbs',steps:['Hold one dumbbell at your chest with both hands.','Squat down between your knees, keeping your chest tall.','Drive up through your whole foot.'],tip:'Elbows go inside your knees at the bottom.'},
  db_rdl:{name:'Dumbbell Romanian Deadlift',e:'🙇',m:['Hamstrings','Glutes','Back'],weight:true,start:'20 lbs each',steps:['Stand holding dumbbells in front of your thighs.','Push your hips back, sliding the weights down your legs. Back stays flat.','Stop when you feel a stretch behind your legs, then stand up.'],tip:'Think "hips back", not "bend down".',video:YT('JCXUYuzwNrM')},
  leg_extension:{name:'Leg Extensions',e:'🦿',m:['Quads'],weight:true,start:'60 lbs',steps:['Sit in the machine with the pad on your lower shins.','Straighten your legs fully and squeeze.','Lower slowly.'],tip:'Hold the handles and keep your bottom on the seat.',video:YT('YyvSfVjQeL0')},
  incline_db_press:{name:'Incline Dumbbell Press',e:'📐',m:['Upper Chest','Shoulders'],weight:true,start:'20 lbs each',steps:['Set a bench at a low incline. Lie back with dumbbells at chest level.','Press them up over your chest.','Lower slowly until your elbows are just below the bench.'],tip:'Keep your feet flat on the floor.',video:YT('8iPEnn-ltC8')},
  cable_row:{name:'Seated Cable Rows',e:'🚣',m:['Back','Biceps'],weight:true,start:'60 lbs',steps:['Sit tall, feet on the platform, knees slightly bent.','Pull the handle to your belly, squeezing your shoulder blades.','Let it go forward slowly without rounding your back.'],tip:'Chest up, shoulders down.',video:YT('GZbfZ033f74')},
  lateral_raise:{name:'Lateral Raises',e:'🕊️',m:['Shoulders'],weight:true,start:'10 lbs each',steps:['Stand holding light dumbbells at your sides.','Raise your arms out to the sides up to shoulder height.','Lower slowly.'],tip:'Go light! Lead with your elbows like you are pouring water.',video:YT('3VcKaXpzqRo')},
  tricep_pushdown:{name:'Tricep Pushdowns',e:'⏬',m:['Triceps'],weight:true,start:'35 lbs',steps:['Stand at a cable machine holding the bar or rope.','Keep elbows pinned to your sides.','Push down until arms are straight, then let it rise slowly.'],tip:'Only your forearms should move.',video:YT('2-LAMcpzODU')},

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoLocal=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; // local date, not UTC
const parseIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const niceDate=s=>parseIso(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

const toUnit=(w,from)=>{from=from||'lbs';if(from===profile.unit)return w;return profile.unit==='kg'?w/2.2046:w*2.2046};
const round1=n=>Math.round(n*10)/10;
const hello=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};

function confirmBox(title,body,okText,onOk,danger){

/* last logged session for an exercise name */
function lastSession(name){
  const j=getJournal();const dates=Object.keys(j).sort().reverse();
  for(const d of dates){const list=(j[d]||[]).filter(e=>e.exercise===name);if(list.length)return list[list.length-1]}
  return null;
}
function workoutDates(){const j=getJournal();return Object.keys(j).filter(d=>(j[d]||[]).length).sort()}
function weekStart(d){const x=new Date(d);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);x.setHours(0,0,0,0);return x}
function weekStreak(){
  const weeks=new Set(workoutDates().map(d=>isoLocal(weekStart(parseIso(d)))));
  let w=weekStart(new Date()),n=0;
  if(!weeks.has(isoLocal(w)))w.setDate(w.getDate()-7);
  while(weeks.has(isoLocal(w))){n++;w.setDate(w.getDate()-7)}
  return n;
}

      <div class="center"><div style="font-size:72px">🏋️‍♀️</div><h1 style="margin-top:10px">Get stronger,<br>one step at a time</h1>
      <p class="muted" style="margin-top:10px">Easy-to-follow workouts for <b>Beginner</b>, <b>Intermediate</b> and <b>Expert</b>. We'll help you pick the right one.</p></div>

      <button class="btn" id="start">Let's go! 🚀</button>
      <button class="btn ghost" id="pick">I already know my level</button>
    </div>`;
    $('#start').onclick=()=>{ob.step=1;render()};
    $('#pick').onclick=()=>{ob.step=99;render()};
    return;
  }
  if(s===1){
    v.innerHTML=`${topbar()}<div class="stack-lg" style="padding-top:20px">
      <div><h1>What should we call you? 👋</h1><p class="muted" style="margin-top:8px">A first name or nickname is perfect. You can skip this.</p></div>
      <input class="txt" id="nm" maxlength="24" placeholder="Your name" value="${esc(ob.name||profile.name)}" autocomplete="given-name">
      <button class="btn" id="next">Next</button><button class="link" id="skip" style="width:100%">Skip</button></div>`;
    const next=()=>{ob.name=$('#nm').value.trim();ob.step=2;ob.answers=[];render()};
    $('#next').onclick=next;$('#skip').onclick=()=>{ob.step=2;ob.answers=[];render()};
    $('#nm').onkeydown=e=>{if(e.key==='Enter')next()};
    return;
  }
  if(s>=2&&s<2+QUIZ.length){
    const i=s-2,Q=QUIZ[i];
    v.innerHTML=`${topbar(`<button class="link" id="back">← Back</button>`)}
    <div class="stack-lg">
      <div class="dots">${QUIZ.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>

function scoreQuiz(){
  const a=ob.answers;const score=[0,1,2,3].reduce((s,i)=>s+(QUIZ[i].a[a[i]]?.[2]||0),0);
  let level=score<=2?'beginner':score<=5?'intermediate':'expert';
  let reason=level==='beginner'?'Perfect place to learn great form and build a strong base.':level==='intermediate'?'You have a good base. Time to add dumbbells and machines.':'You are experienced. Barbells and bigger lifts are next.';
  const age=a[4];
  if(age===0&&level!=='beginner'){level='beginner';reason='Under 13? Bodyweight training is the safest and best way to get strong. Ask an adult to help you check your form.'}
  else if(age===1&&level==='expert'){level='intermediate';reason='You are strong! Under 18, stick with dumbbells and machines unless a coach is watching your barbell lifts.'}
  else if(age===1)reason+=' Train with an adult or coach nearby when using weights.';
  return {level,reason};
}
function levelInner(k){const L=LEVELS[k];return `<div class="t"><span style="font-size:28px">${L.emoji}</span>${L.name}</div>
  <p style="margin-top:4px;font-weight:600">${L.tagline}</p><p class="muted small" style="margin-top:2px">🧰 ${L.equipment}</p>
  <p class="small" style="margin-top:10px;font-weight:700">Choose this if:</p><ul>${L.who.map(w=>`<li>${w}</li>`).join('')}</ul>`}
function levelCard(k,sel){return `<div class="lvl ${sel?'sel':''}" style="--c:${LEVELS[k].color}">${levelInner(k)}</div>`}
function finishOnboard(level){
  if(ob.name)profile.name=ob.name;
  profile.level=level;saveProfile();ob={step:0,answers:[],name:''};
  go('today');toast(`${LEVELS[level].emoji} You're on ${LEVELS[level].name}. Let's do this!`);
}

function finishWorkout(a){

      <li>Sore muscles the next day are normal. <b>Sharp pain is not</b> — stop and tell an adult.</li>
      <li>Under 18? Lift weights with an adult or coach nearby. Under 13? Stick to Beginner bodyweight moves.</li>
      <li>Use a spotter or safety bars for bench press and squats.</li><li>Drink water, eat well, sleep lots. Rest days matter!</li>
      <li>Have a health condition or injury? Check with a doctor before starting.</li></ol></details>
    <div class="card stack"><h3>Your data</h3><p class="small muted">Everything is saved on this device only. Make a backup to move it to a new phone.</p>
      <button class="btn secondary" id="exp">⬇️ Download backup</button>
      <label class="btn secondary" style="cursor:pointer">⬆️ Restore from backup<input type="file" id="imp" accept="application/json,.json" hidden></label>
      <button class="btn danger" id="reset">Erase everything</button></div>
    <p class="small muted center">JAMS Fitness · Made for every level 💙</p>
  </div>`;
  $('#nm').onchange=e=>{profile.name=e.target.value.trim().slice(0,24);saveProfile();toast('Saved')};
  v.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{const k=b.dataset.l;if(k===profile.level)return;
    confirmBox(`Switch to ${LEVELS[k].name}?`,'Your history stays. Your workouts will change to the new level.',`Switch to ${LEVELS[k].name} ${LEVELS[k].emoji}`,()=>{profile.level=k;saveProfile();store.del('jams_active');libLevel=null;render();toast(`${LEVELS[k].emoji} Now on ${LEVELS[k].name}`)})});
  $('#quiz').onclick=()=>{ob={step:2,answers:[],name:profile.name};go('onboard')};
  v.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{profile.unit=b.dataset.u;saveProfile();renderMe(v)});
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{profile.rest=b.dataset.r;saveProfile();renderMe(v)});
  $('#exp').onclick=exportBackup;
  $('#imp').onchange=importBackup;
  $('#reset').onclick=()=>confirmBox('Erase everything?','All workouts and settings on this device will be deleted. Download a backup first if you want to keep them.','Erase all',()=>{store.del(JOURNAL_KEY);store.del('jams_profile');store.del('jams_active');profile={name:'',level:null,unit:'lbs',rest:'auto'};ob={step:0,answers:[],name:''};go('today')},true);
}
function exportBackup(){
  const data={app:'jams-fitness',version:2,exported:new Date().toISOString(),profile,journal:getJournal()};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`jams_fitness_backup_${isoLocal()}.json`;document.body.appendChild(a);a.click();a.remove();
  toast('Backup downloaded');
}
function importBackup(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);const incoming=d&&d.journal?d.journal:d; // supports old backups too
    if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw 0;
    const j=getJournal();let added=0;
    Object.keys(incoming).forEach(k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(incoming[k]))return;
      const have=new Set((j[k]||[]).map(x=>String(x.id)));
      incoming[k].forEach(en=>{if(en&&typeof en.exercise==='string'&&Array.isArray(en.sets)&&!have.has(String(en.id))){(j[k]=j[k]||[]).push(en);added++}})});
    setJournal(j);toast(`Restored ${added} entries ✅`);
  }catch(err){toast('That file is not a JAMS backup')}};
  r.readAsText(f);
}

/* ---------- Start ---------- */
render();
</script>
