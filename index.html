<html lang="en">

<meta name="mobile-web-app-capable" content="yes">

<meta property="og:title" content="KinFit: family workouts for every level">
<meta property="og:description" content="Free workout plans for Beginner, Intermediate and Expert, with guided workouts, badges, a friendly AI coach and family challenges.">

<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --text:#0f172a; --muted:#5b6577; --line:#e5e9f2;
  --brand:#2563eb; --brand-soft:#e8efff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --lvl:#1d4ed8; --lvl-soft:#e8efff; --lvl-text:var(--lvl);
  --radius:20px; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){html:not([data-theme=light]){--bg:#0b1020;--card:#151b2e;--text:#eef2ff;--muted:#94a3b8;--line:#263049;--brand-soft:#1c2a4d;--shadow:none}}html[data-theme=dark]{--bg:#0b1020;--card:#151b2e;--text:#eef2ff;--muted:#94a3b8;--line:#263049;--brand-soft:#1c2a4d;--shadow:none}
body[data-level="beginner"]{--lvl:#15803d;--lvl-soft:#ecf8f0;--lvl-text:#15803d}
body[data-level="intermediate"]{--lvl:#c2410c;--lvl-soft:#fdeee4;--lvl-text:#c2410c}
body[data-level="expert"]{--lvl:#6d28d9;--lvl-soft:#f0e9fe;--lvl-text:#6d28d9}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) body[data-level="beginner"]{--lvl-soft:#12301f}html:not([data-theme=light]) body[data-level="intermediate"]{--lvl-soft:#3a2214}html:not([data-theme=light]) body[data-level="expert"]{--lvl-soft:#2a1f47}}html[data-theme=dark] body[data-level="beginner"]{--lvl-soft:#12301f}html[data-theme=dark] body[data-level="intermediate"]{--lvl-soft:#3a2214}html[data-theme=dark] body[data-level="expert"]{--lvl-soft:#2a1f47}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(110px + var(--safe-b))}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--lvl-soft);color:var(--lvl-text);font-weight:700;font-size:14px;border:0}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--muted);margin:2px 4px 2px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border-radius:16px;border:0;background:var(--lvl);color:#fff;font-weight:800;font-size:18px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--lvl-soft);color:var(--lvl-text)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.danger{background:#fde8e8;color:#b91c1c}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;width:auto;padding:8px 14px}
.link{background:none;border:0;color:var(--lvl-text);font-weight:700;padding:6px 0;min-height:44px}
.footlink{display:inline-block;padding:12px 8px;color:var(--lvl-text)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:.02em}
.logo svg{width:34px;height:34px}
/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}
.tabbar .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:700}
.tab .ic{font-size:23px;line-height:1;filter:grayscale(1);opacity:.65}
.tab.on{color:var(--lvl-text)}
.tab.on .ic{filter:none;opacity:1}
/* Hero */
.hero{background:linear-gradient(135deg,var(--lvl),color-mix(in srgb,var(--lvl) 60%,#000));color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .btn{background:#fff;color:var(--lvl-text)}
.big-emoji{font-size:44px;line-height:1}
/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0 7px;text-align:center;font-size:12px;color:var(--muted)}
.day b{display:block;font-size:13px;color:var(--text)}
.day .e{font-size:18px;display:block;margin-top:2px}
.day.today{border:2px solid var(--lvl);background:var(--lvl-soft)}
.day.done .e::after{content:"✓";color:var(--ok);font-weight:900;font-size:13px;margin-left:1px}
/* Exercise card */
.ex{padding:16px}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-emoji{width:52px;height:52px;flex:0 0 52px;border-radius:16px;background:var(--lvl-soft);display:grid;place-items:center;font-size:28px}
.ex-title{font-weight:800;font-size:18px}
.target{font-weight:700;color:var(--lvl-text);font-size:15px}
details.how{margin-top:12px;border-radius:14px;background:var(--bg);padding:2px 14px}
details.how summary{list-style:none;padding:10px 0;font-weight:700;color:var(--lvl-text);cursor:pointer}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"▸ ";}
details.how[open] summary::before{content:"▾ ";}
details.how ol{margin:0 0 10px;padding-left:22px}
details.how li{margin:6px 0}
.tip{margin:6px 0 12px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px dashed var(--line);font-size:15px}
.hint{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff7e0;color:#7a4b00;font-size:15px;font-weight:600}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .hint{background:#3a2e10;color:#ffd98a}}html[data-theme=dark] .hint{background:#3a2e10;color:#ffd98a}
.sets{margin-top:12px}
.set{display:grid;grid-template-columns:54px 1fr 1fr 56px;gap:8px;align-items:center;margin-top:8px}
.set.nowt{grid-template-columns:54px 1fr 56px}
.set label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px}
.set .n{font-weight:800;color:var(--muted);font-size:15px}
.num{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-size:20px;font-weight:800;padding:0 4px}
.num::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.num:focus{outline:none;border-color:var(--lvl)}
.check{height:50px;width:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:24px;color:var(--muted);align-self:end}
.set.isdone .check{background:var(--ok);border-color:var(--ok);color:#fff}
.set.isdone .num{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--lvl-text);border-radius:99px;transition:width .3s}
/* Level cards */
.lvl{border:2px solid var(--line);text-align:left;width:100%;background:var(--card);border-radius:var(--radius);padding:16px;display:block}
.lvl.sel{border-color:var(--cc,var(--c))}
.lvl .t{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;color:var(--cc,var(--c))}
.lvl ul{margin:8px 0 0;padding-left:20px;color:var(--text);font-size:15px}
.lvl li{margin:3px 0}
/* Quiz */
.opt{display:flex;gap:14px;align-items:center;width:100%;min-height:64px;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:600}
.opt .e{font-size:28px}
.opt:active,.opt.sel{border-color:var(--lvl);background:var(--lvl-soft)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--lvl-text);width:22px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:900;color:var(--lvl-text)}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 2px;border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--lvl-text);box-shadow:var(--shadow)}
select.sel{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;font-weight:600}
input.txt{width:100%;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:19px}
input.txt:focus{outline:none;border-color:var(--lvl)}
.hist{border-left:4px solid var(--lvl);padding:10px 12px;background:var(--card);border-radius:0 14px 14px 0;margin-top:8px}
.badge{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px;margin:4px 4px 0 0}
.xbtn{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 8px;border-radius:8px}
.xbtn:hover{color:var(--bad)}
/* Timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));max-width:536px;margin:0 auto;background:#0f172a;color:#fff;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.3);transform:translateY(calc(100% + 140px));visibility:hidden;transition:transform .25s,visibility .25s}
.timer.show{transform:none;visibility:visible}
.timer .t{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;min-width:74px}
.timer button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.sheet{background:var(--card);border-radius:24px;padding:22px;max-width:520px;width:100%;margin-bottom:var(--safe-b)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,calc(-100% - 60px));background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.celebrate{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.chart{width:100%;height:auto;display:block}
.empty{text-align:center;padding:28px 12px}
.empty .big-emoji{margin-bottom:8px}
.center{text-align:center}
.hide{display:none!important}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:16px;line-height:1.45;word-wrap:break-word}
.msg.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--lvl);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg ul,.msg ol{margin:6px 0;padding-left:20px}.msg li{margin:3px 0}.msg p+p{margin-top:6px}
.msg .src{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:7px;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14.5px;font-weight:600;color:var(--text)}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + var(--safe-b));z-index:15;padding:10px 12px;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.composer form{display:flex;gap:8px;max-width:536px;margin:0 auto}
.composer input{flex:1;height:52px;border-radius:26px;border:1.5px solid var(--line);background:var(--card);padding:0 18px;font-size:17px;min-width:0}
.composer input:focus{outline:none;border-color:var(--lvl)}
.composer button{width:52px;height:52px;border-radius:26px;border:0;background:var(--lvl);color:#fff;font-size:22px;flex:0 0 52px}
.composer button:disabled{opacity:.5}
.fig{width:100%;max-width:240px;display:block;margin:0 auto}
.figbox{background:var(--card);border-radius:14px;margin:2px 0 8px;padding:8px 6px 2px}
:root{--fig-prop:#cbd5e1;--fig-dark:#475569}
@media (prefers-color-scheme:dark){html:not([data-theme=light]){--fig-prop:#334155;--fig-dark:#94a3b8}}html[data-theme=dark]{--fig-prop:#334155;--fig-dark:#94a3b8}
details.fold{padding:16px 18px}
details.fold summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.fold[open] summary::after{transform:rotate(180deg)}
.set.nowt.timed{grid-template-columns:54px 1fr 50px 56px}
.check.go{background:var(--lvl-soft);border-color:transparent;font-size:22px;width:50px}
.who{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:16px}
.who.sel{border-color:var(--lvl)}
.who .av{font-size:28px;width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;background:var(--lvl-soft);border-radius:14px}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avatars button{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px;padding:0}
.avatars button.sel{border-color:var(--lvl);background:var(--lvl-soft)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge-i{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:11.5px;line-height:1.2;text-align:center;color:var(--muted)}
.badge-i span{font-size:28px;filter:grayscale(1);opacity:.45}
.badge-i.on{background:var(--lvl-soft);color:var(--text);border-color:transparent}
.badge-i.on span{filter:none;opacity:1}
.runner{position:fixed;inset:0;background:var(--bg);z-index:45;overflow:auto;padding:16px 16px calc(24px + var(--safe-b))}
.runner-in{max-width:480px;margin:0 auto}
.runner .fig{max-width:220px}
.ring{position:relative;width:190px;height:190px;margin:0 auto}
.ring svg{width:100%;height:100%}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font-size:62px;font-weight:900;font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,Menlo,monospace;font-size:21px;font-weight:800;letter-spacing:.05em;text-align:center;padding:14px;border-radius:14px;background:var(--bg);border:1.5px dashed var(--line);user-select:all;-webkit-user-select:all}
.btn:disabled{opacity:.45}
.sheet{max-height:92vh;overflow:auto}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pthumb{position:relative;padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--bg)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px;font-weight:700;padding:16px 6px 5px}
.pfull{width:100%;max-height:50vh;object-fit:contain;border-radius:14px;background:#000;display:block}
.cmp{position:relative;width:100%;aspect-ratio:3/4;max-height:54vh;border-radius:14px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp-a{position:absolute;inset:0}
.cmp-h{position:absolute;top:0;bottom:0;width:4px;background:#fff;transform:translateX(-50%);box-shadow:0 0 8px rgba(0,0,0,.5)}
.cmp-l,.cmp-r{position:absolute;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px}
.cmp-l{left:10px}.cmp-r{right:10px}
.range{width:100%;accent-color:var(--lvl);height:32px}
.streakpill{background:#fff1e6;color:#9a3412}
.streakpill.off{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .streakpill{background:#3a2214;color:#fdba74}}html[data-theme=dark] .streakpill{background:#3a2214;color:#fdba74}
.card.streak{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fed7aa}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .card.streak{background:linear-gradient(135deg,#2a1a10,#3a2214);border-color:#5a3418}}html[data-theme=dark] .card.streak{background:linear-gradient(135deg,#2a1a10,#3a2214);border-color:#5a3418}
.flame{font-size:44px;line-height:1;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
.flame.off{filter:grayscale(1);opacity:.4;animation:none}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.flame{animation:none}}
.dots7{display:flex;align-items:center;gap:6px;margin-top:8px}
.dots7 i{width:22px;height:8px;border-radius:8px;background:rgba(194,65,12,.18)}
.dots7 i.on{background:#ea580c}
.dots7 span{margin-left:4px}
.logo{white-space:nowrap}
.pill{white-space:nowrap}
.pname{max-width:96px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
@media (max-width:380px){.logo{font-size:0;gap:0}.logo svg{font-size:16px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--text)}
.chips button.on{background:var(--lvl);border-color:var(--lvl);color:#fff}
.ritem{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.num.sm{width:58px;height:42px;font-size:17px}
.txt.area{height:auto;padding:12px 16px;font-size:16px;line-height:1.4;resize:vertical}
.plate-btn{border:0;background:none;font-size:13px;padding:0 0 0 4px;line-height:1}
.effort{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--lvl-soft)}
.effort .seg{margin-top:6px;background:var(--card)}
.effort .seg button{font-size:13.5px}
.barviz{position:relative;height:110px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:14px}
.barline{position:absolute;left:8%;right:8%;top:50%;height:8px;margin-top:-4px;background:#94a3b8;border-radius:4px}
.plates{position:relative;display:flex;align-items:center;gap:3px}
.plates i{display:block;width:14px;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.actgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.actgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--text)}
.actgrid button span{font-size:24px}
.actgrid button.sel{border-color:var(--lvl);background:var(--lvl-soft)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:800;color:var(--muted)}
.daypick button.on{background:var(--lvl);border-color:var(--lvl);color:#fff}
.mmap{width:100%;max-width:300px;margin:0 auto;display:block}
.rec{padding:8px 0;border-bottom:1px solid var(--line)}
.fam{gap:10px}.fam .av{font-size:24px;width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;background:var(--lvl-soft);border-radius:12px}
.famBar{height:8px;background:var(--line);border-radius:8px;margin-top:4px;overflow:hidden}.famBar i{display:block;height:100%;background:var(--lvl-text);border-radius:8px}
.card.five{background:linear-gradient(135deg,#fef9c3,#fde68a);border-color:#fcd34d}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .card.five{background:linear-gradient(135deg,#3a3210,#4a3d10);border-color:#6b5a1a}}html[data-theme=dark] .card.five{background:linear-gradient(135deg,#3a3210,#4a3d10);border-color:#6b5a1a}
.txt.pin{text-align:center;font-size:30px;letter-spacing:.5em}
a.btn{text-decoration:none}
.backup{border:2px solid var(--lvl)}
.txt.small-in{height:44px;font-size:15px}
.wrap,.sheet,.runner-in,.tour-tip{zoom:var(--zoom,1)}
.btn.ghost-light{background:rgba(255,255,255,.18);color:#fff}
.phase .progress{height:8px}
.tour{position:fixed;inset:0;z-index:70}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(2,6,23,.6);transition:all .25s;pointer-events:none}
.tour-tip{position:fixed;left:16px;right:16px;max-width:520px;margin:0 auto;background:var(--card);color:var(--text);border-radius:20px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.3);font-size:17px}
.report .stats{margin-top:4px}
@media print{
  .tabbar,.noprint,.timer,.toast,#layer{display:none!important}
  body,html{background:#fff!important;color:#000!important}
  .wrap{padding:0!important;max-width:none;zoom:1}
  .card{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid;background:#fff!important}
  .stat{background:#fff!important;border:1px solid #ccc!important}
}
.card.chal{background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-color:#c7d2fe}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .card.chal{background:linear-gradient(135deg,#1e1b4b,#312e81);border-color:#3730a3}}html[data-theme=dark] .card.chal{background:linear-gradient(135deg,#1e1b4b,#312e81);border-color:#3730a3}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) body[data-level="beginner"]{--lvl-text:#4ade80}}html[data-theme=dark] body[data-level="beginner"]{--lvl-text:#4ade80}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) body[data-level="intermediate"]{--lvl-text:#fb923c}}html[data-theme=dark] body[data-level="intermediate"]{--lvl-text:#fb923c}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) body[data-level="expert"]{--lvl-text:#a78bfa}}html[data-theme=dark] body[data-level="expert"]{--lvl-text:#a78bfa}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .lvl{--cc:var(--cd)}}html[data-theme=dark] .lvl{--cc:var(--cd)}
.pill{min-height:40px}
.xbtn{min-width:40px;min-height:40px}
.chips button{min-height:40px}
.seg button{min-height:42px}
.daypick button{min-height:44px}
.h3{font-size:18px;font-weight:700}
.numbtn{display:flex;align-items:center;justify-content:center;width:100%;color:var(--text)}
.numbtn .ph{color:var(--muted);font-weight:600}
.picker{display:flex;gap:12px;align-items:center;justify-content:center}
.pkbig{width:76px;height:76px;flex:0 0 76px;border-radius:22px;border:0;background:var(--lvl-soft);color:var(--lvl-text);font-size:42px;font-weight:800;line-height:1}
.pkbig:active{transform:scale(.95)}
.num.pkv{width:140px;height:76px;font-size:38px}
.undo{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));max-width:536px;margin:0 auto;background:#0f172a;color:#fff;border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:35;font-weight:600;transform:translateY(calc(100% + 160px));visibility:hidden;transition:transform .25s,visibility .25s}
.undo.show{transform:none;visibility:visible}
.undo button{border:0;background:#fff;color:#0f172a;font-weight:800;border-radius:10px;padding:10px 16px;min-height:44px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:600;min-height:48px}
.toggle input{width:26px;height:26px;accent-color:var(--lvl)}
.wrows{display:flex;flex-direction:column}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:52px;color:var(--text);font-size:15px}
.wi{font-size:22px;width:30px;text-align:center;flex:0 0 30px}
.wt{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.wt b{font-weight:700}
.wv{font-weight:800;font-size:14px;color:var(--lvl-text);white-space:nowrap}
.mini{display:block;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--lvl-text);border-radius:6px}
</style>
</head>
<body data-level="beginner">
<main class="wrap" id="view"></main>

<nav class="tabbar" id="tabbar" aria-label="Main">
